<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistik Indonesia</title>
<meta name="description" content="Angka resmi Indonesia — penduduk, ekonomi, ketenagakerjaan, pendidikan, kesehatan, dan provinsi — dengan sumber dan tahunnya.">
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="#/">Statistik Indonesia</a>
    <p class="tagline">Angka resmi, sumber jelas.</p>
    <div class="controls">
      <label class="year-pick">Tahun
        <select id="year-select" aria-label="Pilih tahun"></select>
      </label>
      <label class="search-box">Cari
        <input id="site-search" type="search" placeholder="Misalnya: inflasi" aria-label="Cari indikator">
      </label>
    </div>
  </div>
  <nav aria-label="Bagian">
    <a href="#/">Beranda</a>
    <a href="#/penduduk">Penduduk</a>
    <a href="#/ekonomi">Ekonomi</a>
    <a href="#/tenaga-kerja">Ketenagakerjaan</a>
    <a href="#/pendidikan">Pendidikan</a>
    <a href="#/kesehatan">Kesehatan</a>
    <a href="#/provinsi">Provinsi</a>
    <a href="#/tentang">Tentang Data</a>
  </nav>
</header>
<main id="app"></main>
<footer>
  <p>Statistik Indonesia — angka dari Badan Pusat Statistik (BPS), dibulatkan ke satu desimal kecuali yang disebutkan persis. Bukan situs resmi BPS.</p>
</footer>
</body>
</html>
